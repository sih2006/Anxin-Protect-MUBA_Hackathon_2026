services:
  - type: web
    name: anxin-backend
    # Docker rather than the native Python runtime: native runtimes have no
    # apt, so they can never carry the Tesseract OCR engine, and screenshot
    # mode answers "OCR engine is not installed" for every image. The image
    # (backend/Dockerfile) installs Tesseract + the chi_sim pack and pins
    # python:3.12-slim. Paths below are relative to the repository root.
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render only routes traffic to the new container once this returns 200,
    # so a broken image leaves the previous deploy serving instead of a gap.
    healthCheckPath: /health
    envVars:
      - key: GONKA_API_KEY
        sync: false
      - key: GONKA_BASE_URL
        value: https://api.gonkarouter.io
      - key: GONKA_CHAT_PATH
        value: /v1/chat/completions
      - key: GONKA_RECEIPT_PATH
        value: /v1/receipts/{request_id}
      - key: GONKA_MODEL_A
        value: deepseek-ai/DeepSeek-V4-Flash-0731
      - key: GONKA_MODEL_A_LABEL
        value: DeepSeek
      - key: GONKA_MODEL_B
        value: MiniMaxAI/MiniMax-M2.7
      - key: GONKA_MODEL_B_LABEL
        value: MiniMax
      - key: GONKA_MOCK_MODE
        value: "false"
      # Every origin the web app is served from. Browsers send the Origin
      # header without a trailing slash; the backend also strips one, but
      # keep these exact. Add www if it is ever pointed at the frontend.
      - key: CORS_ALLOW_ORIGINS
        value: https://anxin-protect.com,https://www.anxin-protect.com,https://anxin-frontend.onrender.com
      - key: GONKA_TIMEOUT_SECONDS
        value: "45"
      - key: GONKA_MAX_RETRIES
        value: "1"
      - key: GONKA_MAX_TOKENS
        value: "2000"
      - key: MAX_INPUT_CHARS
        value: "4000"
      - key: MAX_IMAGE_BYTES
        value: "8000000"

  - type: web
    name: anxin-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://anxin-backend.onrender.com
