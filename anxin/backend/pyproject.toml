[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Query() *must* be called in argument defaults --
# that is how FastAPI's dependency injection is wired up. Treat them as
# immutable/safe rather than fighting the framework's own idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = true
